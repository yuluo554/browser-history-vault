name: CI

# 事件面：branch push 与 tag push 各产生一条 run（同 sha 两条是合法的，两条都要绿）。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 两条腿 = 两个平台 × **同一个**底线解释器：口径是"底线解释器要真的跑一遍"，
        # 不是"多枚举几个版本"。3.8/3.9/3.10 均已 EOL（3.10 于 2026-10-01 到期），
        # 底线抬到 3.12（EOL 2028-10-31）后矩阵由四腿收敛为两腿。
        # `ubuntu-latest` 自 2026-10-19 起指向 Ubuntu 26：结论必须带 run id + 日期，
        # 否则是引用过期镜像上的旧结论（见 README「开发」与 plan/RELEASE-0.1.1.md）。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      # 编码加固的第三层：入口 reconfigure 救"我们敲的命令"，子进程显式 encoding 救子进程，
      # 这一层救 CI 里全部步骤（CI 的 python 不是我们敲的，没有 -X utf8）。
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # actions/checkout 与 actions/setup-python 都用 v7：v4/v5 每次 run 会报
      # `Node.js 20 is deprecated ... forced to run on Node.js 24`（实测 4 条 warning）。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 准备打包工具链
        run: python -m pip install --upgrade pip setuptools wheel

      - name: 安装本包与开发依赖（测试面 = 安装面 = README 指令面）
        run: python -m pip install -e ".[dev]"

      - name: 全量测试（平台矩阵 × 底线解释器）
        run: python -m pytest

      # 合成数据是"可复跑的测量"的地基：两层断言（冻结产物形态 + 重生成逐字节一致）
      # 必须在**矩阵的每条腿**上都过——否则"逐字节一致"就只是本机运气。
      - name: 合成数据两层断言（形态 + 重生成逐字节一致）
        run: python tools/gen_synthetic_history.py --check

      # 基准。刻意用 --only 列出**已启用**套件：
      # 未启用套件按设计计入退出码 1（未启用 ≠ 通过），直接跑全量会把正常提交跑红。
      # 每交付一个模块就把它的套件从 manifest 翻成 enabled，并加进这里的命令行。
      # B1（归档幂等）随归档模块在 M2 启用：它真跑归档链路（临时库 + 临时快照），
      # 并断言源库 mtime 与字节不变。
      # B2（查询确定性）/ B3（洞察口径）随检索与洞察模块在 M3 启用：都真跑
      # "归档 → 读回 → 检索/洞察"的完整链路，真值逐条点名（样本驱动）+
      # 边界推导 / 打乱输入 / 下钻对账 / 隐私零出现（规则驱动）。
      # B4（聚类与路径）随聚类模块在 M4 启用：真跑聚类链路，主题词族 8 + 路径 5 逐条点名；
      # 规则层考复跑一致 / 打乱输入 / 同分同序 / 阈值取自配置 / 会话口径同源 / 下钻 / 隐私。
      # B5（隐私与零外链）随报告模块在 M5 启用：查四条输出通路（report.json / 人读文本 /
      # report.html / search.csv）的私密零出现、敏感打码、零外链从严档、渲染层 AST 三条、
      # HTML 双跑逐字节、私密 fail-closed。
      - name: 基准（已启用套件；门槛从 manifest 读）
        run: python tools/bench.py --only B0 B1 B2 B3 B4 B5

      # 这一步覆盖裸 console script 通路：`python -m <pkg>` 与裸 `<pkg>` 的 sys.path
      # 来源不同，"前者过了"证明不了"后者能跑"（安装面第四面）。--require-console-script
      # 让"console script 没进 PATH"变红，而不是静默 SKIP。
      - name: 离线 CLI 冒烟（两条通路 × 全部已交付命令）
        run: python tools/smoke_cli.py --require-console-script

# 刻意不放进 CI 的：tools/check_release.py（发布终态门禁）。
# 判据 = "这道门在当前时点本来就该红吗"——tag 未打、Release 未建时它必然红，
# 挂进来只会让每次正常提交都红且没有信息量；它的可跑性与可证伪性由
# tests/test_release_gate.py 覆盖，正式执行时机是发布里程碑收尾。
