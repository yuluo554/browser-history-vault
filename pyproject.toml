[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-history-vault"
description = "浏览器历史本地知识库：先只读归档、再行为洞察；纯本地、零网络请求、零第三方运行时依赖"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "yuluo554" }]
keywords = [
  "browser-history",
  "self-quantified",
  "local-first",
  "sqlite",
  "privacy",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
bhvault = "browser_history_vault.cli:main"

[project.urls]
Repository = "https://github.com/yuluo554/browser-history-vault"

[tool.setuptools]
package-dir = { "" = "src" }
# 数据目录（data/）不进安装包：本项目是源码优先交付，数据底座由仓库树提供，
# 运行期经 --data-root / 仓库相对路径定位（口径见 plan/03 §安装面）。
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "browser_history_vault.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
