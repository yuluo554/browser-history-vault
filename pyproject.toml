[build-system]
# >=77：SPDX `license = "MIT"` + `license-files`（PEP 639）需要 setuptools 77+；
# 旧下限（>=61）会在打包时把 `license` 表形式当弃用写法并告警（见 plan/RELEASE-0.1.1.md）。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-history-vault"
description = "浏览器历史本地知识库：先只读归档、再行为洞察；纯本地、零网络请求、零第三方运行时依赖"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：SPDX 表达式 + 许可文件清单（不再用 `{ file = ... }` 表形式，
# 也不用 `License ::` classifier——两者自 2026 起是弃用写法，上限 2027-02-18）。
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = [
  "browser-history",
  "self-quantified",
  "local-first",
  "sqlite",
  "privacy",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
bhvault = "browser_history_vault.cli:main"

[project.urls]
Repository = "https://github.com/yuluo554/browser-history-vault"

[tool.setuptools]
package-dir = { "" = "src" }
# 数据目录（data/）不进安装包：本项目是源码优先交付，数据底座由仓库树提供，
# 运行期经 --data-root / 仓库相对路径定位（口径见 plan/03 §安装面）。
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "browser_history_vault.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
